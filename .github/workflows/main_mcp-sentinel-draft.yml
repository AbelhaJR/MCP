name: Build and deploy Python project to Azure Function App - mcp-sentinel-draft

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for Azure Linux runtime
        run: |
          python -m pip install --upgrade pip
          mkdir -p .python_packages/lib/site-packages
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            --target=.python_packages/lib/site-packages \
            -r requirements.txt

      - name: Verify project layout
        run: |
          test -d mcp_server
          test -f mcp_server/__init__.py
          test -f mcp_server/app.py
          test -f function_app.py
          test -f mcp_server.py
          test -f host.json
          test -f requirements.txt
          test -f workspace_tables.json

      - name: Create deployment package
        run: |
          zip -r release.zip \
            mcp_server \
            function_app.py \
            mcp_server.py \
            host.json \
            requirements.txt \
            workspace_tables.json \
            .python_packages

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-package
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-package

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'mcp-sentinel-draft'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A7910988EBF64CA4AD382819EAA0E96A }}
          sku: 'flexconsumption'
