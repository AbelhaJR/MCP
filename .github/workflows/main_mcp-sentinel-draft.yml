name: Build and deploy Python project to Azure Function App - mcp-sentinel-draft

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'   # MUST match Azure runtime version

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install Azure-compatible Linux wheels
      - name: Install dependencies for Azure Linux runtime
        run: |
          python -m pip install --upgrade pip
          mkdir -p .python_packages/lib/site-packages
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            --target=.python_packages/lib/site-packages \
            -r requirements.txt

      # Create clean deployment zip
      - name: Create deployment package
        run: |
          zip -r release.zip \
            function_app.py \
            mcp_server.py \
            host.json \
            workspace_tables.json \
            requirements.txt \
            .python_packages

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-package
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Download artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-package

      # Deploy to Azure
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'mcp-sentinel-draft'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A7910988EBF64CA4AD382819EAA0E96A }}
          sku: 'flexconsumption'

